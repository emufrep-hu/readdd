<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서재 - 나만의 독서 기록장</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8fafc;
        }
        /* Custom scrollbar */
        textarea::-webkit-scrollbar, div::-webkit-scrollbar {
            width: 5px;
        }
        textarea::-webkit-scrollbar-thumb, div::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 4px;
        }
        .star-half-left {
            clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%);
        }
        .star-half-right {
            clip-path: polygon(50% 0, 100% 0, 100% 100%, 50% 100%);
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <!-- Header / Navigation Bar -->
    <header class="sticky top-0 z-30 bg-white/80 backdrop-blur-md border-b border-slate-200 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <!-- Left Side: Enlarged Red Add Button & Title "서재" -->
            <div class="flex items-center space-x-4">
                <button id="openModalBtn" onclick="openModal()" class="flex items-center justify-center w-12 h-12 bg-red-500 hover:bg-red-600 active:bg-red-700 text-white rounded-full shadow-lg hover:shadow-red-200 transition-all transform active:scale-95 focus:outline-none focus:ring-4 focus:ring-red-300" title="새 책 추가">
                    <i class="fas fa-plus text-2xl"></i>
                </button>
                <h1 class="text-2xl font-black text-slate-800 tracking-tight flex items-center gap-2">
                    <i class="fas fa-book-open text-red-500"></i>
                    <span>서재</span>
                </h1>
            </div>

            <!-- Right Side: Total Count Badge -->
            <div class="flex items-center space-x-2 sm:space-x-3">
                <!-- Backup Export Button -->
                <button onclick="exportBackup()" class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 font-bold text-xs flex items-center justify-center shadow-sm transition-all transform hover:scale-105 active:scale-95 focus:outline-none focus:ring-2 focus:ring-slate-400" title="백업 저장 (JSON)">
                    <i class="fas fa-download"></i>
                </button>

                <!-- Backup Import Button -->
                <button onclick="triggerImport()" class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 font-bold text-xs flex items-center justify-center shadow-sm transition-all transform hover:scale-105 active:scale-95 focus:outline-none focus:ring-2 focus:ring-slate-400" title="백업 불러오기">
                    <i class="fas fa-upload"></i>
                </button>
                <input type="file" id="backupFileInput" accept=".json" class="hidden" onchange="handleImportBackup(event)">

                <!-- Info Padlet Button -->
                <a href="https://padlet.com/lhh2961/padlet-s024hokilhef9khv28ds" 
                   target="_blank" 
                   rel="noopener noreferrer" 
                   class="w-10 h-10 rounded-full bg-red-500 hover:bg-red-600 active:bg-red-700 text-white font-bold text-lg flex items-center justify-center shadow-md hover:shadow-red-200 transition-all transform hover:scale-105 active:scale-95 focus:outline-none focus:ring-2 focus:ring-red-400" 
                   title="Padlet 링크 열기">
                    !
                </a>

                <!-- Total Count Badge -->
                <div class="bg-red-50 border border-red-100 rounded-full px-4 py-1.5 flex items-center gap-2 shadow-sm">
                    <span class="text-xs font-semibold text-red-600 uppercase tracking-wider">총 읽은 권수</span>
                    <span id="totalCount" class="text-lg font-extrabold text-red-600">0</span>
                    <span class="text-xs font-medium text-red-600">권</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-5xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        
        <!-- Filter & Search Bar -->
        <div class="flex flex-col sm:flex-row justify-between items-center mb-5 gap-3">
            <h2 class="text-base font-semibold text-slate-700 w-full sm:w-auto">
                <i class="fas fa-history text-slate-400 mr-1.5"></i>최근 읽은 책 목록
            </h2>
            <div class="relative w-full sm:w-60">
                <input type="text" id="searchInput" oninput="filterBooks()" placeholder="책 제목 또는 저자 검색..." class="w-full pl-8 pr-3 py-1.5 border border-slate-300 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent bg-white shadow-sm">
                <i class="fas fa-search absolute left-2.5 top-2.5 text-slate-400 text-xs"></i>
            </div>
        </div>

        <!-- Empty State Container -->
        <div id="emptyState" class="hidden flex-col items-center justify-center py-12 bg-white rounded-xl border border-dashed border-slate-200 text-center px-4">
            <div class="w-16 h-16 bg-red-50 rounded-full flex items-center justify-center text-red-500 mb-3 text-2xl">
                <i class="fas fa-book-bookmark"></i>
            </div>
            <h3 class="text-base font-semibold text-slate-700 mb-1">아직 기록된 책이 없어요</h3>
            <p class="text-xs text-slate-500 mb-4 max-w-md">상단 좌측의 큰 빨간색 <b>+</b> 버튼을 눌러 읽은 책의 표지 사진과 평가를 남겨보세요!</p>
            <button onclick="openModal()" class="px-4 py-2 bg-red-500 text-white font-medium text-xs rounded-lg hover:bg-red-600 transition shadow">
                첫 번째 책 등록하기
            </button>
        </div>

        <!-- Compact Book List Grid -->
        <div id="bookGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3.5">
            <!-- Book items will be dynamically injected here -->
        </div>
    </main>

    <!-- Add Book Modal -->
    <div id="bookModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300 p-3">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden transform scale-95 transition-transform duration-300 max-h-[92vh] flex flex-col" id="modalContainer">
            
            <!-- Modal Header -->
            <div class="px-5 py-3 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
                    <i class="fas fa-plus-circle text-red-500"></i>
                    읽은 책 등록하기
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg transition">
                    <i class="fas fa-times text-base"></i>
                </button>
            </div>

            <!-- Modal Form Body -->
            <form id="bookForm" onsubmit="handleSaveBook(event)" class="p-5 space-y-4 overflow-y-auto flex-grow text-xs">
                
                <!-- Top Section: Photo (Left) + Title & Author (Right) -->
                <div class="flex gap-4 items-start">
                    <!-- Photo Box (Left) -->
                    <div class="w-32 flex-shrink-0">
                        <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">책 사진 *</label>
                        <div id="imagePreviewBox" class="w-32 h-40 bg-slate-50 rounded-xl border-2 border-dashed border-slate-300 flex flex-col items-center justify-center cursor-pointer overflow-hidden relative group hover:border-red-400 transition" onclick="document.getElementById('imageFileInput').click()">
                            <img id="imagePreview" src="" class="hidden w-full h-full object-cover">
                            <div id="imagePlaceholder" class="flex flex-col items-center text-center p-2 text-slate-400">
                                <i class="fas fa-camera text-2xl mb-1 text-red-400"></i>
                                <span class="text-[10px] font-medium leading-tight">사진 추가</span>
                            </div>
                        </div>
                        <input type="file" id="imageFileInput" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
                        <input type="url" id="imageUrlInput" placeholder="또는 URL 입력" class="w-full mt-1.5 px-2 py-1 border border-slate-200 rounded text-[10px] focus:ring-1 focus:ring-red-500 focus:outline-none" oninput="handleUrlInput(this.value)">
                    </div>

                    <!-- Title & Author (Right) -->
                    <div class="flex-grow space-y-3 pt-1">
                        <div>
                            <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">책 제목 *</label>
                            <input type="text" id="bookTitle" required placeholder="예: 어린 왕자" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-red-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">저자</label>
                            <input type="text" id="bookAuthor" placeholder="예: 생텍쥐페리" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-red-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">읽은 날짜</label>
                            <input type="date" id="bookDate" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-red-500 focus:outline-none">
                        </div>
                    </div>
                </div>

                <!-- Star Rating (0.5 Step Control) -->
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-[11px] font-bold text-slate-600 uppercase">별점 평가 (0.5 단위)</label>
                        <span id="ratingValueText" class="text-xs font-black text-amber-500">5.0 / 5.0</span>
                    </div>
                    <div class="flex items-center space-x-1 justify-center py-1" id="starContainer">
                        <!-- 5 Star Interactive Items -->
                        <div class="relative text-2xl cursor-pointer select-none text-slate-200" flex>
                            <span class="star-item" data-star="1">★</span>
                        </div>
                    </div>
                    <div class="text-[10px] text-center text-slate-400 mt-1">별의 왼쪽/오른쪽을 누르거나 클릭해 0.5 단위로 평가하세요</div>
                </div>

                <!-- Bottom Section: Comment / Review -->
                <div>
                    <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">가벼운 평가 & 감상평</label>
                    <textarea id="bookReview" rows="3" placeholder="책에 대한 인상 깊었던 문장이나 짧은 평가를 적어보세요..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-red-500 focus:outline-none resize-none"></textarea>
                </div>

                <!-- Footer Action Buttons -->
                <div class="pt-2 flex justify-end gap-2 border-t border-slate-100">
                    <button type="button" onclick="closeModal()" class="px-3.5 py-1.5 border border-slate-300 rounded-lg text-xs font-medium text-slate-600 hover:bg-slate-50 transition">
                        취소
                    </button>
                    <button type="submit" class="px-4 py-1.5 bg-red-500 hover:bg-red-600 text-white font-medium text-xs rounded-lg shadow-sm transition">
                        등록하기
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Custom Modal for Alerts & Confirms -->
    <div id="customModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300 p-3">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-5 text-center transform scale-95 transition-transform duration-300">
            <div id="customModalIcon" class="w-12 h-12 bg-red-50 text-red-500 rounded-full flex items-center justify-center mx-auto mb-3 text-xl">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <h4 id="customModalTitle" class="font-bold text-slate-800 text-sm mb-1">알림</h4>
            <p id="customModalText" class="text-xs text-slate-600 mb-5 leading-relaxed">메시지 내용</p>
            <div id="customModalButtons" class="flex justify-center gap-2">
                <button id="customModalOkBtn" onclick="closeCustomModal()" class="px-4 py-2 bg-red-500 text-white text-xs font-semibold rounded-lg hover:bg-red-600 transition">확인</button>
                <button id="customModalCancelBtn" class="hidden px-4 py-2 bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg hover:bg-slate-300 transition">취소</button>
            </div>
        </div>
    </div>

    <script>
        let books = [];
        let currentRating = 5.0;
        let selectedImageData = '';

        const DEFAULT_COVER = 'https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&q=80&w=600';

        window.onload = function() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('bookDate').value = today;

            const savedData = localStorage.getItem('my_reading_list');
            if (savedData) {
                try {
                    books = JSON.parse(savedData);
                } catch (e) {
                    console.error('Failed to parse saved books:', e);
                    books = [];
                }
            } else {
                books = [
                    {
                        id: 'demo-1',
                        title: '달러구트 꿈 백화점',
                        author: '이미예',
                        image: 'https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&q=80&w=600',
                        rating: 4.5,
                        review: '잠들어야만 입장이 가능한 백화점 이야기! 따뜻해서 부담 없이 읽기 아주 좋았습니다.',
                        date: '2026-10-10',
                        createdAt: Date.now() - 1000
                    },
                    {
                        id: 'demo-2',
                        title: '데미안',
                        author: '헤르만 헤세',
                        image: 'https://images.unsplash.com/photo-1543002588-bfa74002ed7e?auto=format&fit=crop&q=80&w=600',
                        rating: 5.0,
                        review: '새는 알을 깨고 나온다. 알은 세계다. 태어나려는 자는 하나의 세계를 파괴해야 한다.',
                        date: '2026-09-28',
                        createdAt: Date.now() - 5000
                    }
                ];
                saveToLocalStorage();
            }

            initStarPicker();
            setRating(5.0);
            renderBooks();
        };

        /* Custom Modal Helpers */
        function showCustomMessage(text, title = "알림") {
            document.getElementById('customModalTitle').textContent = title;
            document.getElementById('customModalText').textContent = text;
            document.getElementById('customModalCancelBtn').classList.add('hidden');
            const okBtn = document.getElementById('customModalOkBtn');
            okBtn.onclick = closeCustomModal;
            okBtn.textContent = "확인";
            
            const modal = document.getElementById('customModal');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.querySelector('div').classList.remove('scale-95');
            modal.querySelector('div').classList.add('scale-100');
        }

        function showCustomConfirm(text, onConfirm, title = "확인") {
            document.getElementById('customModalTitle').textContent = title;
            document.getElementById('customModalText').textContent = text;
            const cancelBtn = document.getElementById('customModalCancelBtn');
            cancelBtn.classList.remove('hidden');
            
            const okBtn = document.getElementById('customModalOkBtn');
            okBtn.textContent = "확인";
            okBtn.onclick = function() {
                closeCustomModal();
                if (onConfirm) onConfirm();
            };
            cancelBtn.onclick = closeCustomModal;

            const modal = document.getElementById('customModal');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.querySelector('div').classList.remove('scale-95');
            modal.querySelector('div').classList.add('scale-100');
        }

        function closeCustomModal() {
            const modal = document.getElementById('customModal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            modal.querySelector('div').classList.remove('scale-100');
            modal.querySelector('div').classList.add('scale-95');
        }

        function saveToLocalStorage() {
            try {
                localStorage.setItem('my_reading_list', JSON.stringify(books));
                return true;
            } catch (e) {
                console.error(e);
                showCustomMessage("저장 공간이 부족해요. 사진 용량을 줄이거나 오래된 기록을 백업 후 삭제해 주세요.");
                return false;
            }
        }

        /* 0.5 Step Interactive Star Rating Setup */
        function initStarPicker() {
            const container = document.getElementById('starContainer');
            container.innerHTML = '';

            for (let i = 1; i <= 5; i++) {
                const starWrapper = document.createElement('div');
                starWrapper.className = 'relative text-2xl cursor-pointer text-slate-300 hover:scale-110 transition-transform';
                starWrapper.innerHTML = `
                    <i class="far fa-star"></i>
                    <div class="absolute top-0 left-0 overflow-hidden text-amber-400 star-fill-${i}" style="width: 0%;">
                        <i class="fas fa-star"></i>
                    </div>
                `;

                starWrapper.addEventListener('mousemove', (e) => {
                    const rect = starWrapper.getBoundingClientRect();
                    const isLeft = (e.clientX - rect.left) < (rect.width / 2);
                    const val = isLeft ? i - 0.5 : i;
                    updateStarUI(val);
                });

                starWrapper.addEventListener('click', (e) => {
                    const rect = starWrapper.getBoundingClientRect();
                    const isLeft = (e.clientX - rect.left) < (rect.width / 2);
                    currentRating = isLeft ? i - 0.5 : i;
                    setRating(currentRating);
                });

                container.appendChild(starWrapper);
            }

            container.addEventListener('mouseleave', () => {
                updateStarUI(currentRating);
            });
        }

        function setRating(val) {
            currentRating = val;
            updateStarUI(val);
            document.getElementById('ratingValueText').textContent = `${val.toFixed(1)} / 5.0`;
        }

        function updateStarUI(val) {
            const container = document.getElementById('starContainer');
            const stars = container.children;

            for (let i = 1; i <= 5; i++) {
                const fillDiv = stars[i - 1].querySelector(`.star-fill-${i}`);
                if (val >= i) {
                    fillDiv.style.width = '100%';
                } else if (val === i - 0.5) {
                    fillDiv.style.width = '50%';
                } else {
                    fillDiv.style.width = '0%';
                }
            }
            document.getElementById('ratingValueText').textContent = `${val.toFixed(1)} / 5.0`;
        }

        /* Render Compact Book Grid */
        function renderBooks(filteredList = null) {
            const listToRender = filteredList || books;
            const gridContainer = document.getElementById('bookGrid');
            const emptyState = document.getElementById('emptyState');
            const totalCountEl = document.getElementById('totalCount');

            totalCountEl.textContent = books.length;

            if (listToRender.length === 0) {
                gridContainer.innerHTML = '';
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                return;
            }

            emptyState.classList.add('hidden');
            emptyState.classList.remove('flex');

            const sortedBooks = [...listToRender].sort((a, b) => b.createdAt - a.createdAt);

            gridContainer.innerHTML = sortedBooks.map(book => {
                // Generate Stars UI for Card
                let starsHtml = '';
                const fullStars = Math.floor(book.rating);
                const hasHalf = book.rating % 1 !== 0;

                for (let i = 1; i <= 5; i++) {
                    if (i <= fullStars) {
                        starsHtml += '<i class="fas fa-star text-amber-400"></i>';
                    } else if (i === fullStars + 1 && hasHalf) {
                        starsHtml += '<i class="fas fa-star-half-alt text-amber-400"></i>';
                    } else {
                        starsHtml += '<i class="far fa-star text-slate-300"></i>';
                    }
                }

                const formattedDate = book.date ? new Date(book.date).toLocaleDateString('ko-KR', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit'
                }) : '';

                return `
                    <!-- Compact Card Wrapper (Paddings and margins made smaller) -->
                    <div class="bg-white rounded-xl p-3 shadow-sm hover:shadow-md transition duration-200 border border-slate-200/80 flex flex-col items-center text-center relative group">
                        
                        <!-- Book Cover Image Centered -->
                        <div class="w-28 h-36 rounded-lg overflow-hidden bg-slate-100 border border-slate-100 shadow-sm mb-2 flex-shrink-0">
                            <img src="${book.image}" alt="${escapeHtml(book.title)}" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105" onerror="this.onerror=null; this.src='${DEFAULT_COVER}';">
                        </div>

                        <!-- Title & Author Below Photo -->
                        <h3 class="font-bold text-slate-800 text-xs leading-snug line-clamp-1 mb-0.5 w-full">${escapeHtml(book.title)}</h3>
                        <p class="text-[10px] font-medium text-slate-400 truncate w-full mb-1.5">${book.author ? escapeHtml(book.author) : '저자 미상'}</p>
                        
                        <!-- Star Rating -->
                        <div class="flex items-center justify-center gap-1 mb-2">
                            <div class="flex text-[10px] space-x-0.5">${starsHtml}</div>
                            <span class="text-[10px] font-bold text-slate-600">${Number(book.rating).toFixed(1)}</span>
                        </div>

                        <!-- Collapsible Review Button & Box -->
                        <div class="w-full pt-1.5 border-t border-slate-100 flex flex-col items-center">
                            <button onclick="toggleReview('${book.id}')" class="text-[10px] text-red-500 font-medium hover:text-red-600 transition flex items-center gap-1 focus:outline-none py-0.5">
                                <i class="fas fa-comment-alt"></i> <span id="review-btn-text-${book.id}">평가 보기</span>
                            </button>
                            <div id="review-box-${book.id}" class="hidden w-full bg-slate-50 p-2 rounded-lg border border-slate-100 text-slate-600 text-[11px] leading-snug text-left mt-1.5">
                                ${book.review ? escapeHtml(book.review) : '<span class="text-slate-400 italic">작성된 평가가 없습니다.</span>'}
                            </div>
                        </div>

                        <!-- Card Footer -->
                        <div class="w-full flex justify-between items-center text-[9px] text-slate-400 pt-1.5 border-t border-slate-100 mt-2">
                            <span>${formattedDate ? formattedDate : ''}</span>
                            <button onclick="deleteBook('${book.id}')" class="text-slate-300 hover:text-red-500 transition px-1 py-0.5" title="삭제">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleReview(id) {
            const box = document.getElementById(`review-box-${id}`);
            const btnText = document.getElementById(`review-btn-text-${id}`);
            if (box.classList.contains('hidden')) {
                box.classList.remove('hidden');
                btnText.textContent = '평가 숨기기';
            } else {
                box.classList.add('hidden');
                btnText.textContent = '평가 보기';
            }
        }

        function filterBooks() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!query) {
                renderBooks();
                return;
            }
            const filtered = books.filter(b => 
                b.title.toLowerCase().includes(query) || 
                (b.author && b.author.toLowerCase().includes(query)) ||
                (b.review && b.review.toLowerCase().includes(query))
            );
            renderBooks(filtered);
        }

        function openModal() {
            const modal = document.getElementById('bookModal');
            const container = document.getElementById('modalContainer');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            container.classList.remove('scale-95');
            container.classList.add('scale-100');
        }

        function closeModal() {
            const modal = document.getElementById('bookModal');
            const container = document.getElementById('modalContainer');
            modal.classList.add('opacity-0', 'pointer-events-none');
            container.classList.remove('scale-100');
            container.classList.add('scale-95');
            
            setTimeout(() => {
                document.getElementById('bookForm').reset();
                selectedImageData = '';
                document.getElementById('imagePreview').src = '';
                document.getElementById('imagePreview').classList.add('hidden');
                document.getElementById('imagePlaceholder').classList.remove('hidden');
                setRating(5.0);
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('bookDate').value = today;
            }, 300);
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const MAX_SIZE = 600;

                        if (width > height) {
                            if (width > MAX_SIZE) {
                                height *= MAX_SIZE / width;
                                width = MAX_SIZE;
                            }
                        } else {
                            if (height > MAX_SIZE) {
                                width *= MAX_SIZE / height;
                                height = MAX_SIZE;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        selectedImageData = canvas.toDataURL('image/jpeg', 0.7);
                        showPreview(selectedImageData);
                        document.getElementById('imageUrlInput').value = '';
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function handleUrlInput(url) {
            if (url.trim()) {
                selectedImageData = url.trim();
                showPreview(selectedImageData);
            } else {
                selectedImageData = '';
                hidePreview();
            }
        }

        function showPreview(src) {
            const img = document.getElementById('imagePreview');
            const placeholder = document.getElementById('imagePlaceholder');
            img.src = src;
            img.classList.remove('hidden');
            placeholder.classList.add('hidden');
        }

        function hidePreview() {
            const img = document.getElementById('imagePreview');
            const placeholder = document.getElementById('imagePlaceholder');
            img.src = '';
            img.classList.add('hidden');
            placeholder.classList.remove('hidden');
        }

        function handleSaveBook(event) {
            event.preventDefault();

            const title = document.getElementById('bookTitle').value.trim();
            const author = document.getElementById('bookAuthor').value.trim();
            const review = document.getElementById('bookReview').value.trim();
            const date = document.getElementById('bookDate').value;

            if (!title) return;

            const newBook = {
                id: 'book-' + Date.now(),
                title: title,
                author: author,
                image: selectedImageData || DEFAULT_COVER,
                rating: currentRating,
                review: review,
                date: date,
                createdAt: Date.now()
            };

            books.push(newBook);
            if (!saveToLocalStorage()) {
                books.pop(); // Revert addition on error
                renderBooks();
                return;
            }
            renderBooks();
            closeModal();
        }

        function deleteBook(id) {
            books = books.filter(book => book.id !== id);
            saveToLocalStorage();
            renderBooks();
        }

        /* Backup Export and Import Features */
        function exportBackup() {
            const dataStr = JSON.stringify(books, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const downloadAnchor = document.createElement('a');
            const dateStr = new Date().toISOString().split('T')[0];
            downloadAnchor.setAttribute("href", url);
            downloadAnchor.setAttribute("download", `reading-list-backup-${dateStr}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            URL.revokeObjectURL(url);
        }

        function triggerImport() {
            document.getElementById('backupFileInput').click();
        }

        function handleImportBackup(event) {
            const file = event.target.files[0];
            if (!file) return;

            const fileInput = document.getElementById('backupFileInput');
            fileInput.value = '';

            showCustomConfirm("현재 기록이 덮어써집니다. 계속하시겠습니까?", () => {
                const previousBooks = [...books];
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        if (!Array.isArray(parsed)) {
                            throw new Error("Invalid format");
                        }
                        for (let item of parsed) {
                            if (!item || typeof item !== 'object' || !item.id || !item.title) {
                                throw new Error("Missing required fields (id, title)");
                            }
                            if (!item.createdAt) {
                                item.createdAt = Date.now();
                            }
                        }
                        books = parsed;
                        if (saveToLocalStorage()) {
                            renderBooks();
                            showCustomMessage("백업을 성공적으로 불러왔습니다!");
                        } else {
                            books = previousBooks;
                            renderBooks();
                        }
                    } catch (err) {
                        console.error(err);
                        books = previousBooks;
                        renderBooks();
                        showCustomMessage("올바른 백업 파일 형식이 아니에요. JSON 파일을 확인해 주세요.");
                    }
                };
                reader.readAsText(file);
            }, "백업 불러오기");
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
